[project]
name = "attest-code"
version = "0.1.0"
description = "Independent software verification layer: code evaluated against explicit, developer-approved invariants."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[project.scripts]
attest = "apps.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attest_spec", "src/attest_core", "src/apps", "src/examples"]

[tool.hatch.build.targets.sdist]
packages = ["src/attest_spec", "src/attest_core", "src/apps", "src/examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
mypy_path = "src"
